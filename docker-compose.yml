services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zen
      POSTGRES_PASSWORD: zen
      POSTGRES_DB: admin_dev
    ports:
      - '5432:5432'
    volumes:
      - zen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zen -d admin_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://zen:zen@db:5432/admin_dev
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: '*'
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 120
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  zen_pg:
