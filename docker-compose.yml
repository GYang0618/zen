name: zen

services:
  zen-postgres:
    image: postgres:16-alpine
    container_name: zen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: admin_dev
    ports:
      - '5432:5432'
    volumes:
      - zen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d admin_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  zen-langgraph-postgres:
    image: pgvector/pgvector:pg16
    container_name: zen-langgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: langgraph
    ports:
      - '5433:5432'
    volumes:
      - zen_langgraph_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d langgraph']
      interval: 5s
      timeout: 5s
      retries: 10

  zen-minio:
    image: docker.io/bitnamilegacy/minio:latest
    container_name: zen-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: zen
      MINIO_ROOT_PASSWORD: zenminio_secret
      MINIO_DEFAULT_BUCKETS: zen-files
      MINIO_BROWSER: 'on'
      MINIO_CONSOLE_PORT_NUMBER: '9001'
      MINIO_SERVER_URL: http://localhost:9000
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000,http://localhost:8080'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - zen_minio:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    container_name: zen-api
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    # 本地栈沿用上面的示例口令。生产校验会拒绝这些口令，因此这里保持 development。
    environment:
      NODE_ENV: development
      PORT: '3100'
      DATABASE_URL: postgresql://admin:admin123@zen-postgres:5432/admin_dev?schema=public
      CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
      LANGGRAPH_DEPLOYMENT_URL: http://agent:3600
      STORAGE_ENDPOINT: http://zen-minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: zen
      STORAGE_SECRET_KEY: zenminio_secret
      STORAGE_BUCKET: zen-files
      STORAGE_FORCE_PATH_STYLE: 'true'
    ports:
      - '3100:3100'
    depends_on:
      zen-postgres:
        condition: service_healthy
      zen-minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3100/api/health").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  agent:
    container_name: zen-agent
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: agent
    environment:
      PORT: '3600'
      API_BASE_URL: http://api:3100
    ports:
      - '3600:3600'
    volumes:
      - zen_agent_state:/app/apps/agent/.langgraph_api
    depends_on:
      zen-langgraph-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3600/ok").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 120s
    stop_grace_period: 20s

  web:
    container_name: zen-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Zen Pilot 智航平台}
        VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-http://localhost:8080/api}
        VITE_APP_API_TIMEOUT: ${VITE_APP_API_TIMEOUT:-10000}
        VITE_APP_CHAT_API: ${VITE_APP_CHAT_API:-http://localhost:8080/api/chat}
        VITE_APP_COPILOT_KIT_API: ${VITE_APP_COPILOT_KIT_API:-http://localhost:8080/api/copilot}
    environment:
      API_UPSTREAM_PORT: '3100'
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  zen_pg:
    name: zen_postgres_data
  zen_langgraph_pg:
    name: zen_langgraph_postgres_data
  zen_minio:
    name: zen_minio_data
  zen_agent_state:
    name: zen_agent_state
