<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现代化角色管理系统 - High-Fidelity Prototype</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
          },
        },
      },
    }
  </script>
  <style>
    /* Shadcn Theme Variables */
    :root {
      --background: 240 10% 98%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --ring: 240 5.9% 10%;
    }

    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 6%;
      --card-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 15.9%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --ring: 240 4.9% 83.9%;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(155, 155, 155, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(155, 155, 155, 0.5);
    }
  </style>
</head>
<body class="h-full bg-background text-foreground font-sans antialiased selection:bg-zinc-200 dark:selection:bg-zinc-800">
  <div id="root" class="h-full"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const INITIAL_ROLES = [
      {
        id: 'super-admin',

        userCount: 3,
        isSystem: true,
        status: 'active',
        dataScope: 'ALL',
        permissions: ['usr_read', 'usr_create', 'usr_update', 'usr_delete', 'usr_pwd_reset', 'role_read', 'role_edit', 'role_assign', 'rep_view', 'rep_export', 'fin_view', 'fin_payout', 'sys_config', 'sys_log']
      },
      {
        id: 'dept-mgr',

        userCount: 14,

        permissions: ['usr_read', 'usr_create', 'usr_update', 'role_read', 'rep_view', 'rep_export', 'fin_view']

      {
        id: 'fin-spec',
        name: '财务专员',
        code: 'ROLE_FINANCE',
        description: '聚焦于财务核算、开票申请及代付资金审核',
        userCount: 6,
        isSystem: false,
        status: 'active',
        dataScope: 'DEPT_ONLY',
        permissions: ['usr_read', 'rep_view', 'rep_export', 'fin_view', 'fin_payout']
      },
      {
        id: 'dev-lead',
        name: '研发组长',
        code: 'ROLE_DEV_LEAD',
        description: '管理技术团队代码审计与系统诊断，无财务访问权限',
        userCount: 22,
        isSystem: false,
        status: 'active',
        dataScope: 'SELF_ONLY',
        permissions: ['usr_read', 'sys_config', 'sys_log']
      },
      {
        id: 'read-only',
        name: '只读访客',
        code: 'ROLE_GUEST',
        description: '基础受限账号，仅支持查看公开控制台与报表概览',
        userCount: 89,
        isSystem: false,
        status: 'inactive',
        dataScope: 'SELF_ONLY',
        permissions: ['usr_read', 'rep_view']
      }
    ];

    const PERMISSION_MODULES = [
      {
        id: 'user_mgmt',
        title: '用户管理模块',
        description: '人员账号、组织架构与密码重置安全控制',
        items: [
          { id: 'usr_read', label: '查看用户列表与详情', risk: 'low', inherited: false },
          { id: 'usr_create', label: '新建与邀请员工账号', risk: 'medium', inherited: false },
          { id: 'usr_update', label: '编辑员工基本信息与部门', risk: 'medium', inherited: false },
          { id: 'usr_delete', label: '离职员工账号冻结/注销', risk: 'high', inherited: false },
          { id: 'usr_pwd_reset', label: '重置员工二次验证与密码', risk: 'high', inherited: false },
        ]
      },
      {
        id: 'role_mgmt',
        title: '角色与权限矩阵',
        description: 'RBAC角色策略配置、权限划拨与分配',
        items: [
          { id: 'role_read', label: '读取角色与策略模板', risk: 'low', inherited: true, inheritedFrom: '全局基础策略' },
          { id: 'role_edit', label: '创建与修改角色权限配置', risk: 'high', inherited: false },
          { id: 'role_assign', label: '将角色绑定/解绑至具体用户', risk: 'high', inherited: false },
        ]
      },
      {
        id: 'analytics',
        title: '数据与报表中心',
        description: '经营大盘、统计导出与实时指标分析',
        items: [
          { id: 'rep_view', label: '查看可视化 BI 数据大盘', risk: 'low', inherited: false },
          { id: 'rep_export', label: '导出全量报表数据 (CSV/Excel)', risk: 'high', inherited: false },
        ]
      },
      {
        id: 'finance',
        title: '财务与代付控制',
        description: '对公结算、发票开具与对账明细',
        items: [
          { id: 'fin_view', label: '查看财务对账单与流转明细', risk: 'low', inherited: false },
          { id: 'fin_payout', label: '执行代付打款与大额资金划转', risk: 'high', inherited: false },
        ]
      },
      {
        id: 'system',
        title: '系统运维与日志',
        description: '环境变量设置、审计日志与灾备快照',
        items: [
          { id: 'sys_config', label: '修改全局系统运行参数', risk: 'high', inherited: false },
          { id: 'sys_log', label: '检索与查看安全审计日志', risk: 'medium', inherited: true, inheritedFrom: '合规审计组' },
        ]
      }
    ];

    const MOCK_USERS = [
      { id: 'u1', name: '张伟', email: 'zhangwei@company.com', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80', dept: '产研中心', joined: '2023-04-12' },
      { id: 'u2', name: '李娜', email: 'lina@company.com', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80', dept: '财务部', joined: '2022-11-05' },
      { id: 'u3', name: '王强', email: 'wangqiang@company.com', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80', dept: '运营中心', joined: '2024-01-20' },
      { id: 'u4', name: '陈敏', email: 'chenmin@company.com', avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&auto=format&fit=crop&q=80', dept: '人力资源部', joined: '2023-08-15' },
      { id: 'u5', name: '赵杰', email: 'zhaojie@company.com', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&auto=format&fit=crop&q=80', dept: '产研中心', joined: '2021-09-01' },
    ];

    const INITIAL_AUDIT_LOGS = [
      { id: 'al-1', user: '系统管理员 (Admin)', action: '修改权限配置', target: '部门经理', time: '10 分钟前', detail: '为角色添加了 [导出全量报表数据] 权限' },
      { id: 'al-2', user: '张伟', action: '分配用户角色', target: '财务专员', time: '2 小时前', detail: '将用户 [李娜] 添加至财务专员角色' },
      { id: 'al-3', user: '系统安全组件', action: '策略自动升级', target: '超级管理员', time: '昨天 18:30', detail: '启用了强制双因子验证 (2FA) 策略' },
    ];

    const Icon = ({ name, className = "w-4 h-4" }) => {
      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    function App() {
      // Theme State
      const [darkMode, setDarkMode] = React.useState(false);

      // Data States
      const [roles, setRoles] = React.useState(INITIAL_ROLES);
      const [selectedRoleId, setSelectedRoleId] = React.useState('dept-mgr');
      const [activeTab, setActiveTab] = React.useState('permissions'); // permissions, users, scope, audit
      const [roleSearch, setRoleSearch] = React.useState('');
      const [permSearch, setPermSearch] = React.useState('');
      
      // Draft State for Unsaved Changes Buffer
      const [draftPermissions, setDraftPermissions] = React.useState([]);
      const [draftScope, setDraftScope] = React.useState('DEPT_AND_SUB');
      const [isDirty, setIsDirty] = React.useState(false);

      // Assigned Users State for Current Role
      const [assignedUserIds, setAssignedUserIds] = React.useState(['u1', 'u2']);

      // Modals
      const [showDiffModal, setShowDiffModal] = React.useState(false);
      const [showNewRoleModal, setShowNewRoleModal] = React.useState(false);
      const [showCloneRoleModal, setShowCloneRoleModal] = React.useState(false);
      const [showEditRoleModal, setShowEditRoleModal] = React.useState(false);
      const [showAddUserModal, setShowAddUserModal] = React.useState(false);
      
      // Toast state
      const [toastMessage, setToastMessage] = React.useState(null);

      // Audit Logs
      const [auditLogs, setAuditLogs] = React.useState(INITIAL_AUDIT_LOGS);

      // Get Current Active Role
      const currentRole = roles.find(r => r.id === selectedRoleId) || roles[0];

      // Sync draft state when changing active role
      React.useEffect(() => {
        if (currentRole) {
          setDraftPermissions([...currentRole.permissions]);
          setDraftScope(currentRole.dataScope);
          setIsDirty(false);
        }
      }, [selectedRoleId]);

      // Re-initialize Lucide Icons on DOM updates
      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Toggle Theme
      const toggleDarkMode = () => {
        setDarkMode(!darkMode);
        document.documentElement.classList.toggle('dark');
      };

      // Toast Helper
      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Handle Permission Switch Toggle
      const handleTogglePermission = (permId, isInherited) => {
        if (isInherited) {
          triggerToast('继承自上级策略的权限无法在此角色直接修改');
          return;
        }
        let updated;
        if (draftPermissions.includes(permId)) {
          updated = draftPermissions.filter(p => p !== permId);
        } else {
          updated = [...draftPermissions, permId];
        }
        setDraftPermissions(updated);
        checkIsDirty(updated, draftScope);
      };

      // Handle Module Level Select All / Deselect All
      const handleToggleModuleAll = (moduleItemIds) => {
        const nonInheritedIds = moduleItemIds.filter(id => {
          for (let m of PERMISSION_MODULES) {
            let found = m.items.find(i => i.id === id);
            if (found && found.inherited) return false;
          }
          return true;
        });

        const allSelected = nonInheritedIds.every(id => draftPermissions.includes(id));
        let updated;
        if (allSelected) {
          updated = draftPermissions.filter(id => !nonInheritedIds.includes(id));
        } else {
          const toAdd = nonInheritedIds.filter(id => !draftPermissions.includes(id));
          updated = [...draftPermissions, ...toAdd];
        }
        setDraftPermissions(updated);
        checkIsDirty(updated, draftScope);
      };

      // Helper to check if an item is read-only
      const isReadOnlyPerm = (item) => {
        return item.id.endsWith('_read') || item.id.endsWith('_view') || item.id.endsWith('_log') ||
               item.label.includes('查看') || item.label.includes('读取') || item.label.includes('检索');
      };

      // Handle Quick Read-Only Across All Modules
      const handleSetReadOnly = () => {
        const allItems = PERMISSION_MODULES.flatMap(m => m.items);
        const readOnlyIds = allItems
          .filter(item => {
            if (item.inherited) return draftPermissions.includes(item.id);
            return isReadOnlyPerm(item);
          })
          .map(item => item.id);

        setDraftPermissions(readOnlyIds);
        checkIsDirty(readOnlyIds, draftScope);
        triggerToast('已切换为「一键只读」：保留所有查看/读取权限，关闭其他修改及写操作');
      };

      // Handle Quick Clear All Editable Permissions
      const handleClearAllPermissions = () => {
        const allItems = PERMISSION_MODULES.flatMap(m => m.items);
        const inheritedOnly = allItems
          .filter(item => item.inherited && draftPermissions.includes(item.id))
          .map(item => item.id);

        setDraftPermissions(inheritedOnly);
        checkIsDirty(inheritedOnly, draftScope);
        triggerToast('已一键清空全模块可编辑权限');
      };

      // Handle Scope Change
      const handleScopeChange = (newScope) => {
        setDraftScope(newScope);
        checkIsDirty(draftPermissions, newScope);
      };

      // Check if current state differs from role baseline
      const checkIsDirty = (newPerms, newScope) => {
        const origPerms = currentRole.permissions;
        const origScope = currentRole.dataScope;
        
        const permsChanged = newPerms.length !== origPerms.length || 
          newPerms.some(p => !origPerms.includes(p)) ||
          origPerms.some(p => !newPerms.includes(p));
        
        const scopeChanged = newScope !== origScope;

        setIsDirty(permsChanged || scopeChanged);
      };

      // Reset Draft Changes
      const handleResetChanges = () => {
        setDraftPermissions([...currentRole.permissions]);
        setDraftScope(currentRole.dataScope);
        setIsDirty(false);
        triggerToast('已重置为改动前的初始配置');
      };

      // Compute Differences
      const getDiff = () => {
        const origPerms = currentRole.permissions;
        const added = draftPermissions.filter(p => !origPerms.includes(p));
        const removed = origPerms.filter(p => !draftPermissions.includes(p));
        const scopeChanged = draftScope !== currentRole.dataScope;

        return { added, removed, scopeChanged };
      };

      // Commit Save
      const handleCommitSave = () => {
        const diff = getDiff();
        setRoles(prev => prev.map(r => {
          if (r.id === selectedRoleId) {
            return {
              ...r,
              permissions: [...draftPermissions],
              dataScope: draftScope
            };
          }
          return r;
        }));

        const newLog = {
          id: `al-${Date.now()}`,
          user: '超级管理员 (当前账号)',
          action: '更新角色规则',
          target: currentRole.name,
          time: '刚刚',
          detail: `修改了权限策略: 新增 ${diff.added.length} 项, 移除 ${diff.removed.length} 项${diff.scopeChanged ? `, 作用域变更为 [${draftScope}]` : ''}`
        };
        setAuditLogs([newLog, ...auditLogs]);

        setIsDirty(false);
        setShowDiffModal(false);
        triggerToast(`已成功保存对角色「${currentRole.name}」的配置修改`);
      };

      // Add New Role
      const handleCreateRole = (newRoleData) => {
        const newRoleObj = {
          id: `role-${Date.now()}`,
          name: newRoleData.name,
          code: newRoleData.code,
          description: newRoleData.description,
          userCount: 0,
          isSystem: false,
          status: 'active',
          dataScope: 'DEPT_ONLY',
          permissions: ['usr_read', 'rep_view']
        };
        setRoles([...roles, newRoleObj]);
        setSelectedRoleId(newRoleObj.id);
        setShowNewRoleModal(false);
        triggerToast(`成功新建角色「${newRoleData.name}」`);
      };

      // Clone Current Role Strategy
      const handleCloneRole = (cloneData) => {
        const newRoleObj = {
          id: `role-${Date.now()}`,
          name: cloneData.name,
          code: cloneData.code,
          description: cloneData.description,
          userCount: 0,
          isSystem: false,
          status: 'active',
          dataScope: currentRole.dataScope,
          permissions: [...currentRole.permissions]
        };
        setRoles([...roles, newRoleObj]);
        setSelectedRoleId(newRoleObj.id);
        setShowCloneRoleModal(false);

        const newLog = {
          id: `al-${Date.now()}`,
          user: '超级管理员 (当前账号)',
          action: '克隆角色策略',
          target: cloneData.name,
          time: '刚刚',
          detail: `基于模板「${currentRole.name}」复制生成新角色，深拷贝了 ${currentRole.permissions.length} 项功能权限与数据边界 [${currentRole.dataScope}]`
        };
        setAuditLogs([newLog, ...auditLogs]);

        triggerToast(`已成功基于「${currentRole.name}」克隆生成新角色「${cloneData.name}」`);
      };

      // Edit Current Role Info
      const handleEditRoleInfo = (updatedData) => {
        const oldName = currentRole.name;
        setRoles(roles.map(r => {
          if (r.id === selectedRoleId) {
            return {
              ...r,
              name: updatedData.name,
              code: updatedData.code,
              description: updatedData.description
            };
          }
          return r;
        }));

        setShowEditRoleModal(false);

        const newLog = {
          id: `al-${Date.now()}`,
          user: '超级管理员 (当前账号)',
          action: '更新角色基本信息',
          target: updatedData.name,
          time: '刚刚',
          detail: `将角色 [${oldName}] 的元数据进行了更新：名称变更、描述调整或标识码微调`
        };
        setAuditLogs([newLog, ...auditLogs]);

        triggerToast(`已更新角色「${updatedData.name}」的基本信息`);
      };

      // Toggle Role Active/Inactive Status
      const handleToggleRoleStatus = () => {
        const nextStatus = currentRole.status === 'active' ? 'inactive' : 'active';
        setRoles(roles.map(r => {
          if (r.id === selectedRoleId) {
            return { ...r, status: nextStatus };
          }
          return r;
        }));

        const newLog = {
          id: `al-${Date.now()}`,
          user: '超级管理员 (当前账号)',
          action: nextStatus === 'active' ? '解冻恢复角色' : '临时冻结角色',
          target: currentRole.name,
          time: '刚刚',
          detail: `将角色状态切换为 [${nextStatus === 'active' ? '正常调度' : '受限冻结'}]，影响 ${currentRole.userCount} 名关联用户`
        };
        setAuditLogs([newLog, ...auditLogs]);

        triggerToast(`已${nextStatus === 'active' ? '恢复启用' : '成功冻结'}角色「${currentRole.name}」`);
      };

      // Add User to Role
      const handleAddUserToRole = (userId) => {
        if (!assignedUserIds.includes(userId)) {
          setAssignedUserIds([...assignedUserIds, userId]);
          setRoles(roles.map(r => r.id === selectedRoleId ? { ...r, userCount: r.userCount + 1 } : r));
          triggerToast('已成功添加所选人员至该角色');
        }
      };

      // Remove User from Role
      const handleRemoveUserFromRole = (userId) => {
        setAssignedUserIds(assignedUserIds.filter(id => id !== userId));
        setRoles(roles.map(r => r.id === selectedRoleId ? { ...r, userCount: Math.max(0, r.userCount - 1) } : r));
        triggerToast('已将人员从当前角色解绑');
      };

      // Filtered Roles
      const filteredRoles = roles.filter(r => 
        r.name.toLowerCase().includes(roleSearch.toLowerCase()) || 
        r.code.toLowerCase().includes(roleSearch.toLowerCase())
      );

      return (
        <div className="flex h-screen w-full flex-col bg-background text-foreground overflow-hidden">
          
          {/* Top Global Navigation Bar */}
          <header className="flex h-14 shrink-0 items-center justify-between border-b border-border px-6 bg-card">
            <div className="flex items-center gap-3">

                <button 
                  onClick={() => setShowDiffModal(true)}
                  className="rounded-full bg-emerald-500 hover:bg-emerald-600 px-4 py-1.5 text-xs font-medium text-white shadow-md transition-all"
                >
                  查看 Diff 并保存
                </button>
              </div>
            </div>
          )}

          {/* MODAL 1: DIFF CONFIRMATION */}
          {showDiffModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <div className="w-full max-w-lg rounded-xl border border-border bg-card p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-border pb-3">
                  <h3 className="text-base font-semibold text-foreground flex items-center gap-2">
                    <Icon name="git-compare" className="w-4 h-4 text-primary" />
                    确认权限变更策略 (Diff)
                  </h3>
                  <button onClick={() => setShowDiffModal(false)} className="text-muted-foreground hover:text-foreground">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs max-h-60 overflow-y-auto pr-1">
                  {getDiff().added.length > 0 && (
                    <div className="space-y-1">
                      <span className="font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                        + 新增的权限策略 ({getDiff().added.length}):
                      </span>
                      <ul className="space-y-1 pl-3">
                        {getDiff().added.map(id => (
                          <li key={id} className="font-mono bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 p-1.5 rounded border border-emerald-500/20">
                            {id}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {getDiff().removed.length > 0 && (
                    <div className="space-y-1 pt-2">
                      <span className="font-semibold text-rose-600 dark:text-rose-400 flex items-center gap-1">
                        - 移除的权限策略 ({getDiff().removed.length}):
                      </span>
                      <ul className="space-y-1 pl-3">
                        {getDiff().removed.map(id => (
                          <li key={id} className="font-mono bg-rose-500/10 text-rose-700 dark:text-rose-300 p-1.5 rounded border border-rose-500/20">
                            {id}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {getDiff().scopeChanged && (
                    <div className="pt-2">
                      <span className="font-semibold text-amber-600 dark:text-amber-400">
                        Δ 数据作用域变更:
                      </span>
                      <div className="p-2 bg-amber-500/10 border border-amber-500/20 rounded mt-1 font-mono">
                        {currentRole.dataScope} ➔ {draftScope}
                      </div>
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-border">
                  <button 
                    onClick={() => setShowDiffModal(false)}
                    className="rounded-md border border-input px-3 py-1.5 text-xs font-medium hover:bg-accent"
                  >
                    再想想
                  </button>
                  <button 
                    onClick={handleCommitSave}
                    className="rounded-md bg-primary px-4 py-1.5 text-xs font-medium text-primary-foreground hover:bg-primary/90"
                  >
                    确认提交生效
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: NEW ROLE */}
          {showNewRoleModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <form 
                onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  handleCreateRole({
                    name: formData.get('name'),
                    code: formData.get('code'),
                    description: formData.get('description'),
                  });
                }}
                className="w-full max-w-md rounded-xl border border-border bg-card p-6 shadow-xl space-y-4"
              >
                <div className="flex items-center justify-between border-b border-border pb-3">
                  <h3 className="text-base font-semibold text-foreground">新建角色定义</h3>
                  <button type="button" onClick={() => setShowNewRoleModal(false)} className="text-muted-foreground hover:text-foreground">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-medium mb-1">角色名称 *</label>
                    <input name="name" required placeholder="例如: 极客运维专家" className="w-full rounded-md border border-input bg-background p-2 focus:ring-1 focus:ring-ring" />
                  </div>
                  <div>
                    <label className="block font-medium mb-1">唯一标识 Code *</label>
                    <input name="code" required placeholder="例如: ROLE_OPS_EXPERT" className="w-full rounded-md border border-input bg-background p-2 font-mono focus:ring-1 focus:ring-ring" />
                  </div>
                  <div>
                    <label className="block font-medium mb-1">角色描述说明</label>
                    <textarea name="description" rows="3" placeholder="明确该角色对应的团队岗位职责与权限边界..." className="w-full rounded-md border border-input bg-background p-2 focus:ring-1 focus:ring-ring"></textarea>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-border">
                  <button type="button" onClick={() => setShowNewRoleModal(false)} className="rounded-md border border-input px-3 py-1.5 text-xs font-medium hover:bg-accent">
                    取消
                  </button>
                  <button type="submit" className="rounded-md bg-primary px-4 py-1.5 text-xs font-medium text-primary-foreground hover:bg-primary/90">
                    创建角色
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 3: CLONE ROLE */}
          {showCloneRoleModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <form 
                onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  handleCloneRole({
                    name: formData.get('name'),
                    code: formData.get('code'),
                    description: formData.get('description'),
                  });
                }}
                className="w-full max-w-md rounded-xl border border-border bg-card p-6 shadow-xl space-y-4"
              >
                <div className="flex items-center justify-between border-b border-border pb-3">
                  <div>
                    <h3 className="text-base font-semibold text-foreground flex items-center gap-2">
                      <Icon name="copy" className="w-4 h-4 text-primary" />
                      克隆角色策略
                    </h3>
                    <p className="text-xs text-muted-foreground mt-0.5">将深拷贝模版「{currentRole.name}」的全量权限与配置</p>
                  </div>
                  <button type="button" onClick={() => setShowCloneRoleModal(false)} className="text-muted-foreground hover:text-foreground">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="p-3 rounded-lg bg-muted/60 border border-border/60 text-xs space-y-1">
                  <div className="font-medium text-foreground flex items-center justify-between">
                    <span>继承模板信息：</span>
                    <span className="font-mono text-muted-foreground">{currentRole.code}</span>
                  </div>
                  <div className="text-muted-foreground flex items-center gap-4">
                    <span>功能权限: <strong className="text-foreground">{currentRole.permissions.length} 项</strong></span>
                    <span>数据作用域: <strong className="text-foreground">{currentRole.dataScope}</strong></span>
                  </div>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-medium mb-1">新角色名称 *</label>
                    <input 
                      name="name" 
                      required 
                      defaultValue={`${currentRole.name} - 副本`}
                      className="w-full rounded-md border border-input bg-background p-2 focus:ring-1 focus:ring-ring" 
                    />
                  </div>
                  <div>
                    <label className="block font-medium mb-1">唯一标识 Code *</label>
                    <input 
                      name="code" 
                      required 
                      defaultValue={`${currentRole.code}_COPY`}
                      className="w-full rounded-md border border-input bg-background p-2 font-mono focus:ring-1 focus:ring-ring" 
                    />
                  </div>
                  <div>
                    <label className="block font-medium mb-1">新角色描述说明</label>
                    <textarea 
                      name="description" 
                      rows="2" 
                      defaultValue={`克隆自模板「${currentRole.name}」。${currentRole.description}`}
                      className="w-full rounded-md border border-input bg-background p-2 focus:ring-1 focus:ring-ring"
                    ></textarea>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-border">
                  <button type="button" onClick={() => setShowCloneRoleModal(false)} className="rounded-md border border-input px-3 py-1.5 text-xs font-medium hover:bg-accent">
                    取消
                  </button>
                  <button type="submit" className="rounded-md bg-primary px-4 py-1.5 text-xs font-medium text-primary-foreground hover:bg-primary/90">
                    确认克隆生成
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 4: EDIT ROLE INFO */}
          {showEditRoleModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <form 
                onSubmit={(e) => {
                  e.preventDefault();
                  const formData = new FormData(e.target);
                  handleEditRoleInfo({
                    name: formData.get('name'),
                    code: currentRole.code,
                    description: formData.get('description'),
                  });
                }}
                className="w-full max-w-md rounded-xl border border-border bg-card p-6 shadow-xl space-y-4"
              >
                <div className="flex items-center justify-between border-b border-border pb-3">
                  <div>
                    <h3 className="text-base font-semibold text-foreground flex items-center gap-2">
                      <Icon name="pencil" className="w-4 h-4 text-primary" />
                      编辑角色基本信息
                    </h3>
                    <p className="text-xs text-muted-foreground mt-0.5">修改角色的显示名称与业务说明</p>
                  </div>
                  <button type="button" onClick={() => setShowEditRoleModal(false)} className="text-muted-foreground hover:text-foreground">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-medium mb-1">角色名称 *</label>
                    <input 
                      name="name" 
                      required 
                      defaultValue={currentRole.name}
                      className="w-full rounded-md border border-input bg-background p-2 focus:ring-1 focus:ring-ring" 
                    />
                  </div>
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block font-medium">唯一标识 Code (不可修改)</label>
                      <span className="text-[10px] text-muted-foreground flex items-center gap-1">
                        <Icon name="lock" className="w-3 h-3" />
                        系统绑定标识
                      </span>
                    </div>
                    <input 
                      name="code" 
                      disabled
                      defaultValue={currentRole.code}
                      className="w-full rounded-md border border-input p-2 font-mono bg-muted/60 text-muted-foreground cursor-not-allowed" 
                    />
                    <p className="text-[10px] text-muted-foreground mt-1">
                      🔒 Role Code 为物理策略绑定标识，创建后不可修改以防后端 API 鉴权失效
                    </p>
                  </div>
                  <div>
                    <label className="block font-medium mb-1">角色描述说明</label>
                    <textarea 
                      name="description" 
                      rows="3" 
                      defaultValue={currentRole.description}
                      className="w-full rounded-md border border-input bg-background p-2 focus:ring-1 focus:ring-ring"
                    ></textarea>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-border">
                  <button type="button" onClick={() => setShowEditRoleModal(false)} className="rounded-md border border-input px-3 py-1.5 text-xs font-medium hover:bg-accent">
                    取消
                  </button>
                  <button type="submit" className="rounded-md bg-primary px-4 py-1.5 text-xs font-medium text-primary-foreground hover:bg-primary/90">
                    保存修改
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL 5: ADD USER */}
          {showAddUserModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
              <div className="w-full max-w-md rounded-xl border border-border bg-card p-6 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-border pb-3">
                  <h3 className="text-base font-semibold text-foreground flex items-center gap-2">
                    <Icon name="user-plus" className="w-4 h-4 text-primary" />
                    添加关联人员
                  </h3>
                  <button type="button" onClick={() => setShowAddUserModal(false)} className="text-muted-foreground hover:text-foreground">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {MOCK_USERS.map(u => {
                    const isAssigned = assignedUserIds.includes(u.id);
                    return (
                      <div key={u.id} className="flex items-center justify-between p-2.5 rounded-lg border border-border/50 bg-background hover:bg-muted/40">
                        <div className="flex items-center gap-2.5">
                          <img src={u.avatar} className="h-8 w-8 rounded-full object-cover border border-border" />
                          <div>
                            <div className="text-xs font-medium text-foreground">{u.name} <span className="text-muted-foreground">({u.dept})</span></div>
                            <div className="text-[10px] text-muted-foreground font-mono">{u.email}</div>
                          </div>
                        </div>
                        {isAssigned ? (
                          <span className="text-[10px] text-muted-foreground bg-muted px-2 py-1 rounded font-medium">已绑定</span>
                        ) : (
                          <button 
                            type="button" 
                            onClick={() => handleAddUserToRole(u.id)}
                            className="rounded-md bg-primary px-2.5 py-1 text-xs font-medium text-primary-foreground hover:bg-primary/90 transition-colors"
                          >
                            添加
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>

                <div className="flex items-center justify-end pt-3 border-t border-border">
                  <button type="button" onClick={() => setShowAddUserModal(false)} className="rounded-md border border-input px-3 py-1.5 text-xs font-medium hover:bg-accent">
                    完成
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Notification Box */}
          {toastMessage && (
            <div className="fixed top-4 right-4 z-50 flex items-center gap-2 rounded-lg border border-border bg-card px-4 py-3 text-xs font-medium text-foreground shadow-lg animate-in fade-in slide-in-from-top-2">
              <Icon name="info" className="w-4 h-4 text-primary" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
