name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          # Prisma 生成客户端时只读取该变量，不会连接数据库。
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public

      - name: Plugin check (validate + generate --check)
        run: pnpm run plugin:check

      - name: Typecheck
        run: pnpm run check-types

      - name: RBAC checks
        run: pnpm run check:rbac

      - name: Default Agent boundary check
        run: pnpm run check:default-agent

      - name: Test
        run: pnpm run test

      - name: Docs link check
        run: pnpm run docs:check-links
