name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plugin check (validate + generate --check)
        run: pnpm run plugin:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check-types

      - name: RBAC checks
        run: pnpm run check:rbac

      - name: Default Agent boundary check
        run: pnpm run check:default-agent

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Docs link check
        run: pnpm run docs:check-links
