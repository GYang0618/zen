<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 只跟浏览器的 prefers-color-scheme，不跟页面里的亮色 / 暗色 / 跟随系统。 -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/logo-dark.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zen Pilot 智航平台</title>
    <script>
      (() => {
        try {
          // Cookie 名须与 src/context/theme-provider.tsx 等保持一致
          const root = document.documentElement;
          const themeMatch = document.cookie.match(
            /(?:^|; )vite-ui-theme=([^;]*)/,
          );
          let theme = themeMatch ? decodeURIComponent(themeMatch[1]) : "system";
          if (theme !== "light" && theme !== "dark" && theme !== "system")
            theme = "system";
          const resolvedTheme =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
              ? "dark"
              : "light";
          root.classList.remove("light", "dark");
          root.classList.add(resolvedTheme);
          const baseMatch = document.cookie.match(
            /(?:^|; )vite-ui-base-color=([^;]*)/,
          );
          const brandMatch = document.cookie.match(
            /(?:^|; )vite-ui-brand-color=([^;]*)/,
          );
          const styleMatch = document.cookie.match(
            /(?:^|; )vite-ui-style=([^;]*)/,
          );
          const fontMatch = document.cookie.match(
            /(?:^|; )vite-ui-font=([^;]*)/,
          );
          const legacyFontMatch = document.cookie.match(/(?:^|; )font=([^;]*)/);
          let base = baseMatch ? decodeURIComponent(baseMatch[1]) : "slate";
          let brand = brandMatch ? decodeURIComponent(brandMatch[1]) : "slate";
          const style = styleMatch ? decodeURIComponent(styleMatch[1]) : "nova";
          let font = fontMatch
            ? decodeURIComponent(fontMatch[1])
            : legacyFontMatch
              ? decodeURIComponent(legacyFontMatch[1])
              : "geist";
          const bases = [
            "slate",
            "neutral",
            "stone",
            "zinc",
            "mauve",
            "olive",
            "mist",
            "taupe",
          ];
          const brands = [
            "slate",
            "neutral",
            "amber",
            "blue",
            "cyan",
            "emerald",
            "fuchsia",
            "green",
            "indigo",
            "lime",
            "orange",
            "pink",
            "purple",
            "red",
            "rose",
            "sky",
            "teal",
            "violet",
            "yellow",
          ];
          const styles = [
            "nova",
            "vega",
            "maia",
            "lyra",
            "mira",
            "luma",
            "sera",
            "rhea",
          ];
          const fonts = [
            "geist",
            "inter",
            "noto-sans",
            "nunito-sans",
            "figtree",
            "roboto",
            "raleway",
            "dm-sans",
            "public-sans",
            "outfit",
            "oxanium",
            "manrope",
            "space-grotesk",
            "montserrat",
            "ibm-plex-sans",
            "source-sans-3",
            "instrument-sans",
            "jetbrains-mono",
            "geist-mono",
            "noto-serif",
            "roboto-slab",
            "merriweather",
            "lora",
            "playfair-display",
            "eb-garamond",
            "instrument-serif",
          ];
          if (base === "default") base = "slate";
          if (brand === "default" || brand === "zinc") brand = "slate";
          if (font === "system") font = "geist";
          root.setAttribute(
            "data-base-color",
            bases.indexOf(base) >= 0 ? base : "slate",
          );
          root.setAttribute(
            "data-brand-color",
            brands.indexOf(brand) >= 0 ? brand : "slate",
          );
          root.setAttribute(
            "data-style",
            styles.indexOf(style) >= 0 ? style : "nova",
          );
          root.setAttribute(
            "data-font",
            fonts.indexOf(font) >= 0 ? font : "geist",
          );
        } catch (_) {}
      })();
    </script>
    <!--
      冷启动画布。样式必须内联：此时 Tailwind 与 React 都还没到。
      颜色优先用主题变量，变量未注入前用与 slate 默认 token 一致的回退色。
    -->
    <style>
      html {
        background: var(--background, #fff);
        color: var(--foreground, oklch(0.129 0.042 264.695));
        color-scheme: light;
      }
      html.dark {
        background: var(--background, oklch(0.129 0.042 264.695));
        color: var(--foreground, oklch(0.984 0.003 247.858));
        color-scheme: dark;
      }
      body {
        margin: 0;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--background, #fff);
        color: var(--foreground, inherit);
      }
      html.dark #boot-splash {
        background: var(--background, oklch(0.129 0.042 264.695));
      }
      :is(#boot-splash, .boot-screen) .boot-mark {
        display: flex;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid var(--border, color-mix(in oklch, currentColor 14%, transparent));
        background: color-mix(in oklch, var(--card, Canvas) 80%, transparent);
        box-shadow: 0 1px 2px color-mix(in oklch, CanvasText 6%, transparent);
      }
      /*
        与 BootLoading 共用。行高、字族、字距必须写死：
        应用样式注入后 html 会变成 line-height: 1.5 和主题字体，
        这里若不锁住，开屏文字会在 root 挂载时重排。
      */
      :is(#boot-splash, .boot-screen) .boot-brand {
        margin: 20px 0 0;
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 0;
        border: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        font-weight: 700;
        letter-spacing: -0.025em;
        font-feature-settings: normal;
        font-variation-settings: normal;
        font-synthesis: none;
      }
      :is(#boot-splash, .boot-screen) :is(.boot-brand, .boot-tagline, .boot-status),
      #boot-splash .boot-status-line {
        color: inherit;
      }
      :is(#boot-splash, .boot-screen) :is(.boot-tagline, .boot-status) {
        font-weight: 400;
      }
      :is(#boot-splash, .boot-screen) .boot-status {
        margin: 6px 0 0;
        padding: 0;
        border: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 12px;
        line-height: calc(1 / 0.75);
        letter-spacing: normal;
        font-feature-settings: normal;
        font-variation-settings: normal;
        font-synthesis: none;
      }
      #boot-splash .boot-status {
        display: grid;
        justify-items: center;
        width: 12rem;
        height: calc(1em / 0.75);
      }
      #boot-splash .boot-status-line {
        grid-area: 1 / 1;
        width: 100%;
        text-align: center;
        font-weight: 400;
        opacity: 0;
        transform: translateY(0.35em);
        transition:
          opacity 0.48s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.48s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot-splash .boot-status-line.is-current {
        opacity: 1;
        transform: translateY(0);
      }
      #boot-splash .boot-status-line.is-leaving {
        opacity: 0;
        transform: translateY(-0.35em);
      }
      #boot-splash .boot-progress {
        margin-top: 32px;
        width: 12rem;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--muted, color-mix(in oklch, currentColor 12%, transparent));
      }
      #boot-splash .boot-progress > span {
        display: block;
        height: 100%;
        width: 40%;
        background: var(--primary, currentColor);
        animation: boot-progress 1.1s ease-in-out infinite;
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .zen-core,
        #boot-splash .zen-beam,
        #boot-splash .boot-progress > span {
          animation: none;
        }
        #boot-splash .boot-status-line,
        #boot-splash .boot-status-line.is-current,
        #boot-splash .boot-status-line.is-leaving {
          transition: none;
          transform: none;
        }
        #boot-splash .zen-core {
          opacity: 0.12;
        }
        #boot-splash .zen-beam {
          stroke-dasharray: none;
          stroke-dashoffset: 0;
        }
        #boot-splash .boot-progress > span {
          width: 100%;
          transform: none;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      必须放在 #root 之外。React createRoot 会清掉挂载点里的节点。
      文案与 src/config/brand.ts、BootLoading 默认状态一致。
      标记与 public/logo-loading.svg 一致，改动画时两处一起改。
      路由首次 onResolved 后由 src/main.tsx 移除。
    -->
    <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-mark">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" aria-hidden="true" focusable="false">
          <style>
            @keyframes zen-core-breathe {
              0%,
              100% {
                opacity: 0.05;
                transform: scale(0.94);
              }
              45%,
              60% {
                opacity: 0.18;
                transform: scale(1);
              }
            }
            @keyframes zen-beam-flow {
              0% {
                stroke-dashoffset: 100;
              }
              45%,
              58% {
                stroke-dashoffset: 0;
              }
              100% {
                stroke-dashoffset: -100;
              }
            }
            .zen-core {
              transform-origin: 12px 12px;
              animation: zen-core-breathe 2.67s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            }
            .zen-beam {
              stroke-dasharray: 100 100;
              stroke-dashoffset: 100;
              animation: zen-beam-flow 2.67s cubic-bezier(0.65, 0, 0.35, 1) infinite;
            }
          </style>
          <path
            d="M1.6 15.2V5.6C1.6 3.39086 3.39086 1.6 5.6 1.6H19.6L4.4 16.8"
            stroke="currentColor"
            stroke-opacity="0.14"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M22.4 8.8V18.4C22.4 20.6091 20.6091 22.4 18.4 22.4H4.4L19.6 7.2"
            stroke="currentColor"
            stroke-opacity="0.14"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            class="zen-core"
            d="M1 6.2C1 3.328 3.328 1 6.2 1H18.8L6.2 13.6H17.8C20.672 13.6 23 15.928 23 18.8C23 21.672 20.672 23 17.8 23H5.2L17.8 10.4H6.2C3.328 10.4 1 8.52 1 6.2Z"
            fill="currentColor"
          />
          <path
            class="zen-beam"
            pathLength="100"
            d="M1.6 15.2V5.6C1.6 3.39086 3.39086 1.6 5.6 1.6H19.6L4.4 16.8"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            class="zen-beam"
            pathLength="100"
            d="M22.4 8.8V18.4C22.4 20.6091 20.6091 22.4 18.4 22.4H4.4L19.6 7.2"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <p class="boot-brand"><span>ZenPilot</span><span class="boot-tagline">智航平台</span></p>
      <!-- 初始文案须与 src/lib/boot-splash.ts 的 BOOT_STATUS.runtime 一致 -->
      <p class="boot-status"><span class="boot-status-line is-current">正在加载运行环境</span></p>
      <div class="boot-progress" aria-hidden="true"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
