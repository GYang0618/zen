<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <script>
      ;(() => {
        try {
          // Cookie 名须与 src/context/theme-provider.tsx 等保持一致
          const root = document.documentElement
          const themeMatch = document.cookie.match(/(?:^|; )vite-ui-theme=([^;]*)/)
          let theme = themeMatch ? decodeURIComponent(themeMatch[1]) : 'system'
          if (theme !== 'light' && theme !== 'dark' && theme !== 'system') theme = 'system'
          const resolvedTheme =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light'
          root.classList.remove('light', 'dark')
          root.classList.add(resolvedTheme)
          const baseMatch = document.cookie.match(/(?:^|; )vite-ui-base-color=([^;]*)/)
          const brandMatch = document.cookie.match(/(?:^|; )vite-ui-brand-color=([^;]*)/)
          const styleMatch = document.cookie.match(/(?:^|; )vite-ui-style=([^;]*)/)
          const fontMatch = document.cookie.match(/(?:^|; )vite-ui-font=([^;]*)/)
          const legacyFontMatch = document.cookie.match(/(?:^|; )font=([^;]*)/)
          let base = baseMatch ? decodeURIComponent(baseMatch[1]) : 'slate'
          let brand = brandMatch ? decodeURIComponent(brandMatch[1]) : 'slate'
          const style = styleMatch ? decodeURIComponent(styleMatch[1]) : 'nova'
          let font = fontMatch
            ? decodeURIComponent(fontMatch[1])
            : legacyFontMatch
              ? decodeURIComponent(legacyFontMatch[1])
              : 'geist'
          const bases = [
            'slate',
            'neutral',
            'stone',
            'zinc',
            'mauve',
            'olive',
            'mist',
            'taupe'
          ]
          const brands = [
            'slate',
            'neutral',
            'amber',
            'blue',
            'cyan',
            'emerald',
            'fuchsia',
            'green',
            'indigo',
            'lime',
            'orange',
            'pink',
            'purple',
            'red',
            'rose',
            'sky',
            'teal',
            'violet',
            'yellow'
          ]
          const styles = ['nova', 'vega', 'maia', 'lyra', 'mira', 'luma', 'sera', 'rhea']
          const fonts = [
            'geist',
            'inter',
            'noto-sans',
            'nunito-sans',
            'figtree',
            'roboto',
            'raleway',
            'dm-sans',
            'public-sans',
            'outfit',
            'oxanium',
            'manrope',
            'space-grotesk',
            'montserrat',
            'ibm-plex-sans',
            'source-sans-3',
            'instrument-sans',
            'jetbrains-mono',
            'geist-mono',
            'noto-serif',
            'roboto-slab',
            'merriweather',
            'lora',
            'playfair-display',
            'eb-garamond',
            'instrument-serif'
          ]
          if (base === 'default') base = 'slate'
          if (brand === 'default' || brand === 'zinc') brand = 'slate'
          if (font === 'system') font = 'geist'
          root.setAttribute('data-base-color', bases.indexOf(base) >= 0 ? base : 'slate')
          root.setAttribute('data-brand-color', brands.indexOf(brand) >= 0 ? brand : 'slate')
          root.setAttribute('data-style', styles.indexOf(style) >= 0 ? style : 'nova')
          root.setAttribute('data-font', fonts.indexOf(font) >= 0 ? font : 'geist')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
